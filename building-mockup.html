<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Building Mockup</title>
  <style>
    :root {
      --bg: #14171a;
      --panel: #1c2023;
      --ink: #eceeec;
      --muted: #8b9390;
      --line: #2c3134;
      --occupied: #d98a5a;
      --vacant: #565e5a;
      --overdue: #c14b4b;
      --accent: #5fa889;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #canvas-holder {
      position: absolute;
      inset: 0;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;
    }

    #hud .title {
      font-size: 20px;
      color: var(--ink);
      text-transform: none;
      letter-spacing: 0;
      font-weight: 600;
      margin-bottom: 4px;
    }

    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
    }

    #legend .item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #legend .dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    #panel {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: 320px;
      background: var(--panel);
      box-shadow: -12px 0 30px rgba(0, 0, 0, 0.08);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(.2, .9, .3, 1);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
    }

    #panel.open {
      transform: translateX(0);
    }

    #panel .close {
      align-self: flex-end;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
    }

    #panel .unit-id {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    #panel .tenant-name {
      font-size: 24px;
      font-weight: 600;
      margin: 4px 0 18px 0;
    }

    #panel .status-badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 999px;
      color: white;
      margin-bottom: 20px;
      width: fit-content;
    }

    #panel .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
    }

    #panel .row .label {
      color: var(--muted);
    }

    #panel .row .value {
      font-weight: 500;
    }

    #panel .vacant-msg {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      padding-top: 12px;
    }

    #empty-state {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 12px;
      color: var(--muted);
      max-width: 220px;
      text-align: right;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="canvas-holder"></div>

    <div id="hud">
      <div class="title">Elm Street Residences</div>
      <div>Drag to orbit &middot; Click a unit</div>
    </div>

    <div id="legend">
      <div class="item">
        <div class="dot" style="background:var(--occupied)"></div>Occupied
      </div>
      <div class="item">
        <div class="dot" style="background:var(--overdue)"></div>Rent overdue
      </div>
      <div class="item">
        <div class="dot" style="background:var(--vacant)"></div>Vacant
      </div>
    </div>

    <div id="empty-state">Click any highlighted block to view unit details</div>

    <div id="panel">
      <button class="close" id="closeBtn">Close ✕</button>
      <div id="panelContent"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x14171a);
      scene.fog = new THREE.Fog(0x14171a, 18, 34);

      const holder = document.getElementById('canvas-holder');
      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(11, 9, 13);
      camera.lookAt(0, 3, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      holder.appendChild(renderer.domElement);

      // lighting
      const hemi = new THREE.HemisphereLight(0x3a4c55, 0x0c0e10, 0.6);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xcfe0ff, 0.55);
      sun.position.set(8, 14, 6);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.left = -12;
      sun.shadow.camera.right = 12;
      sun.shadow.camera.top = 12;
      sun.shadow.camera.bottom = -12;
      scene.add(sun);
      const rim = new THREE.DirectionalLight(0x5fa889, 0.3);
      rim.position.set(-6, 6, -8);
      scene.add(rim);

      // ground
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x0e1113, roughness: 1 });
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // simple ground grid for a "site plan" feel
      const grid = new THREE.GridHelper(60, 60, 0x262b2e, 0x1a1e20);
      grid.position.y = 0.01;
      scene.add(grid);

      // ---- Building data: floors x units-per-floor ----
      const FLOORS = 3;
      const UNITS_PER_FLOOR = 3;
      const UNIT_W = 2.6, UNIT_H = 1.9, UNIT_D = 3.2;
      const BUILDING_W = UNIT_W * UNITS_PER_FLOOR;

      const statusColor = {
        occupied: 0xc97a4a,
        overdue: 0xb23b3b,
        vacant: 0xa9b6b0
      };

      const names = ["A. Delgado", "M. Santos", "—", "J. Ramirez", "—", "K. Villanueva", "R. Cruz", "—", "T. Bautista"];
      const statuses = ["occupied", "occupied", "vacant", "overdue", "vacant", "occupied", "occupied", "vacant", "occupied"];
      const rents = [12500, 13000, 0, 12500, 0, 14000, 13500, 0, 12500];

      const unitMeshes = [];
      const buildingGroup = new THREE.Group();
      scene.add(buildingGroup);

      let idx = 0;
      for (let f = 0; f < FLOORS; f++) {
        for (let u = 0; u < UNITS_PER_FLOOR; u++) {
          const status = statuses[idx % statuses.length];
          const color = statusColor[status];

          const geo = new THREE.BoxGeometry(UNIT_W - 0.12, UNIT_H - 0.12, UNIT_D - 0.12);
          const mat = new THREE.MeshStandardMaterial({
            color: 0x33383b,
            roughness: 0.85,
            metalness: 0.05
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.castShadow = true;
          mesh.receiveShadow = true;

          const x = (u - (UNITS_PER_FLOOR - 1) / 2) * UNIT_W;
          const y = f * UNIT_H + UNIT_H / 2;
          const z = 0;
          mesh.position.set(x, y, z);

          // status strip along the base of the unit (thin colored block)
          const stripGeo = new THREE.BoxGeometry(UNIT_W - 0.12, 0.14, UNIT_D - 0.10);
          const stripMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
          const strip = new THREE.Mesh(stripGeo, stripMat);
          strip.position.set(x, y - UNIT_H / 2 + 0.07, z);
          strip.castShadow = true;
          buildingGroup.add(strip);

          // window (flat plane on front face)
          const winGeo = new THREE.PlaneGeometry(0.7, 0.7);
          const winMat = new THREE.MeshStandardMaterial({ color: 0xf2c98a, emissive: 0xf2c98a, emissiveIntensity: status === 'vacant' ? 0.02 : 0.35, roughness: 0.4, metalness: 0.1, side: THREE.DoubleSide });
          const win = new THREE.Mesh(winGeo, winMat);
          win.position.set(x - 0.55, y + 0.15, z + UNIT_D / 2 - 0.05);
          buildingGroup.add(win);

          const win2 = win.clone();
          win2.position.x = x + 0.55;
          buildingGroup.add(win2);

          // door on ground floor units only
          if (f === 0) {
            const doorGeo = new THREE.PlaneGeometry(0.55, 1.0);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x5fa889, roughness: 0.5, side: THREE.DoubleSide });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(x, y - UNIT_H / 2 + 0.5, z + UNIT_D / 2 - 0.04);
            buildingGroup.add(door);
          }

          mesh.userData = {
            unitId: "Unit " + String.fromCharCode(65 + f) + (u + 1),
            tenant: names[idx % names.length],
            status: status,
            rent: rents[idx % rents.length],
            floor: f + 1
          };

          buildingGroup.add(mesh);
          unitMeshes.push(mesh);
          idx++;
        }
      }

      // roof (simple pitched prism) sitting on top of the building
      const roofHeight = 1.4;
      const roofWidth = BUILDING_W + 0.4;
      const roofDepth = UNIT_D + 0.4;
      const roofShape = new THREE.BufferGeometry();
      const rw = roofWidth / 2, rd = roofDepth / 2, rh = roofHeight;
      const topY = FLOORS * UNIT_H;

      const vertices = new Float32Array([
        // base rectangle (4 verts) + ridge line (2 verts)
        -rw, topY, -rd, rw, topY, -rd, rw, topY, rd, -rw, topY, rd,
        -rw * 0.02, topY + rh, -rd, -rw * 0.02, topY + rh, rd
      ]);
      // Build roof faces manually as a simple prism (two trapezoids + two triangles + ridge)
      const roofGeo = new THREE.BufferGeometry();
      const rIdxV = new Float32Array([
        -rw, topY, -rd, rw, topY, -rd, 0, topY + rh, -rd,   // front triangle
        -rw, topY, rd, rw, topY, rd, 0, topY + rh, rd,   // back triangle
        -rw, topY, -rd, 0, topY + rh, -rd, 0, topY + rh, rd, -rw, topY, -rd, 0, topY + rh, rd, -rw, topY, rd, // left slope
        rw, topY, -rd, rw, topY, rd, 0, topY + rh, rd, rw, topY, -rd, 0, topY + rh, rd, 0, topY + rh, -rd // right slope
      ]);
      roofGeo.setAttribute('position', new THREE.BufferAttribute(rIdxV, 3));
      roofGeo.computeVertexNormals();
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x22282a, roughness: 0.8, side: THREE.DoubleSide });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.castShadow = true;
      buildingGroup.add(roof);

      buildingGroup.position.y = 0;

      // ---- Orbit-ish controls (lightweight, no extra deps) ----
      let isDragging = false, prevX = 0, prevY = 0;
      let theta = Math.atan2(camera.position.x, camera.position.z);
      let phi = Math.acos(camera.position.y / camera.position.length());
      let radius = camera.position.length();

      function updateCamera() {
        camera.position.x = radius * Math.sin(phi) * Math.sin(theta);
        camera.position.z = radius * Math.sin(phi) * Math.cos(theta);
        camera.position.y = radius * Math.cos(phi);
        camera.lookAt(0, 2.6, 0);
      }
      updateCamera();

      renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const dx = e.clientX - prevX, dy = e.clientY - prevY;
        theta -= dx * 0.006;
        phi -= dy * 0.006;
        phi = Math.max(0.35, Math.min(1.3, phi));
        prevX = e.clientX; prevY = e.clientY;
        updateCamera();
      });
      renderer.domElement.addEventListener('wheel', e => {
        radius += e.deltaY * 0.01;
        radius = Math.max(8, Math.min(24, radius));
        updateCamera();
      }, { passive: true });

      // touch support
      let touchStartDist = null;
      renderer.domElement.addEventListener('touchstart', e => {
        if (e.touches.length === 1) { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }
      });
      renderer.domElement.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && isDragging) {
          const dx = e.touches[0].clientX - prevX, dy = e.touches[0].clientY - prevY;
          theta -= dx * 0.006; phi -= dy * 0.006;
          phi = Math.max(0.35, Math.min(1.3, phi));
          prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
          updateCamera();
        }
      });
      renderer.domElement.addEventListener('touchend', () => isDragging = false);

      // ---- Raycasting for click-to-select ----
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const panel = document.getElementById('panel');
      const panelContent = document.getElementById('panelContent');
      const closeBtn = document.getElementById('closeBtn');
      let selected = null;
      let dragMoved = false;

      renderer.domElement.addEventListener('mousedown', () => dragMoved = false);
      renderer.domElement.addEventListener('mousemove', () => { if (isDragging) dragMoved = true; });

      renderer.domElement.addEventListener('click', (e) => {
        if (dragMoved) return;
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(unitMeshes);
        if (hits.length > 0) {
          selectUnit(hits[0].object);
        }
      });

      function resetHighlight() {
        unitMeshes.forEach(m => m.material.emissive && m.material.emissive.setHex(0x000000));
      }

      function selectUnit(mesh) {
        resetHighlight();
        mesh.material.emissive = new THREE.Color(0x3c6e59);
        mesh.material.emissiveIntensity = 0.15;
        selected = mesh;
        const d = mesh.userData;

        const statusLabel = { occupied: "Occupied", overdue: "Rent overdue", vacant: "Vacant" }[d.status];
        const statusBg = { occupied: "var(--occupied)", overdue: "var(--overdue)", vacant: "var(--vacant)" }[d.status];

        if (d.status === "vacant") {
          panelContent.innerHTML = `
        <div class="unit-id">${d.unitId} &middot; Floor ${d.floor}</div>
        <div class="tenant-name">Vacant</div>
        <div class="status-badge" style="background:${statusBg}">${statusLabel}</div>
        <div class="vacant-msg">No active tenant. Ready to list — last occupied unit renewed for ₱12,500/mo.</div>
      `;
        } else {
          panelContent.innerHTML = `
        <div class="unit-id">${d.unitId} &middot; Floor ${d.floor}</div>
        <div class="tenant-name">${d.tenant}</div>
        <div class="status-badge" style="background:${statusBg}">${statusLabel}</div>
        <div class="row"><span class="label">Monthly rent</span><span class="value">₱${d.rent.toLocaleString()}</span></div>
        <div class="row"><span class="label">Lease start</span><span class="value">Jan 2025</span></div>
        <div class="row"><span class="label">Lease end</span><span class="value">Dec 2026</span></div>
        <div class="row"><span class="label">Contact</span><span class="value">0917 000 0000</span></div>
      `;
        }
        panel.classList.add('open');
      }

      closeBtn.addEventListener('click', () => {
        panel.classList.remove('open');
        resetHighlight();
        selected = null;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>

</html>
